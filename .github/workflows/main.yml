name: Auto Unzip and Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        if [ -f "neuro-trans-app.zip" ]; then
          unzip -o neuro-trans-app.zip -d extracted_app
          mv extracted_app/*/* . 2>/dev/null || mv extracted_app/* . 2>/dev/null || true
        fi

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Auto Fix and Upgrade Outdated Dependencies
      run: |
        flutter clean
        flutter pub upgrade --major-versions --allow-newer
        cd android && ./gradlew clean || true
        cd ..

    - name: Build Flutter APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Neuro-Trans-App-APK
        path: build/app/outputs/flutter-apk/app-release.apk
